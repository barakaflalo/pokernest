<!doctype html>
<html lang="he" dir="rtl" data-theme="gold" data-mode="night" data-board="felt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PokerNest · פוקר</title>
<meta name="description" content="טקסס הולדם, אומהה, 5 קלפים, 3 קלפים וקריבי — מול המחשב, בטלפון אחד או אונליין עם חברים, עם לחץ-ודבר. צ'יפים וירטואליים בלבד.">
<meta name="theme-color" content="#0a0a0a">
<meta property="og:title" content="PokerNest · פוקר">
<meta property="og:description" content="חמש גרסאות פוקר עם חברים — אונליין עם דיבור, או מול המחשב. צ'יפים וירטואליים בלבד.">
<meta property="og:image" content="icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ---------------- tokens: app theme (data-theme × data-mode) ---------------- */
:root{
  --bg:#070707; --panel:#121212; --panel2:#1a1a1a; --line:#2c2a24; --ink:#f3efe4; --muted:#a39d8c;
  --acc:#d4a940; --acc2:#f0cd6e; --accInk:#140f02; --ok:#46b46e; --bad:#e0584f;
  --felt1:#1f6b45; --felt2:#0f4029; --feltLine:rgba(255,255,255,.10); --feltInk:#f4f1e6;
  --cardFace:#fdfbf4; --cardEdge:#cfcac0; --red:#c4262e; --blk:#141414; --s2:#c4262e; --s3:#141414;
  --back1:#141414; --back2:#d4a940;
  --r:14px; --disp:'Secular One','Rubik',system-ui,sans-serif; --body:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
[data-theme="silver"]{--acc:#c9ced6;--acc2:#eef1f5;--accInk:#0d0f12;--line:#2a2d33;--back2:#c9ced6}
[data-theme="emerald"]{--acc:#3fbf7f;--acc2:#7fe0ae;--accInk:#03140b;--line:#1f3329;--back2:#3fbf7f}
[data-theme="ruby"]{--acc:#e0566a;--acc2:#f598a6;--accInk:#1a0408;--line:#3a2328;--back2:#e0566a}
[data-theme="ocean"]{--acc:#4aa8e8;--acc2:#97d0f6;--accInk:#03111c;--line:#1f2d3a;--back2:#4aa8e8}
[data-mode="day"]{--bg:#f4f2ec;--panel:#ffffff;--panel2:#f0ede5;--line:#d9d3c4;--ink:#17150f;--muted:#6b6455;--back1:#2a261c}
[data-mode="day"][data-theme="gold"]{--acc:#a8801c;--acc2:#c99b2c;--accInk:#fff}
[data-mode="day"][data-theme="silver"]{--acc:#5c6573;--acc2:#7d8796;--accInk:#fff}
[data-mode="day"][data-theme="emerald"]{--acc:#1f8a55;--acc2:#2ea96b;--accInk:#fff}
[data-mode="day"][data-theme="ruby"]{--acc:#b8344a;--acc2:#d14d62;--accInk:#fff}
[data-mode="day"][data-theme="ocean"]{--acc:#1f6fa8;--acc2:#2f8acb;--accInk:#fff}
/* table colour is its own setting (written after the themes, same specificity → it wins) */
[data-board="felt"]{--felt1:#1f6b45;--felt2:#0f4029;--feltInk:#f4f1e6;--feltLine:rgba(255,255,255,.10)}
[data-board="wood"]{--felt1:#8a5a32;--felt2:#5a3519;--feltInk:#fff6e8;--feltLine:rgba(255,235,200,.14)}
[data-board="blue"]{--felt1:#1d4f7a;--felt2:#0e2a45;--feltInk:#eef5ff;--feltLine:rgba(255,255,255,.10)}
[data-board="contrast"]{--felt1:#0c0c0c;--felt2:#000;--feltInk:#fff;--feltLine:rgba(255,255,255,.35);--cardEdge:#fff}
[data-board="theme"]{--felt1:var(--panel2);--felt2:var(--bg);--feltInk:var(--ink);--feltLine:var(--line)}
[data-four="1"]{--s2:#1b5fc4;--s3:#1d8a3a}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
.hide{display:none!important}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ---------------- screens ---------------- */
.scr{display:none;min-height:100vh;min-height:100dvh;animation:scrIn .22s ease}
.scr.on{display:block}
@keyframes scrIn{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.bar h2{margin:0;font-family:var(--disp);font-weight:400;font-size:21px;flex:1}
.back{min-width:48px;height:44px;border-radius:12px;border:1.5px solid var(--acc);background:transparent;color:var(--acc);font-size:22px;font-weight:700;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 90px}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--acc);background:transparent;color:var(--acc);font-weight:500;font-size:16px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.btn.main{background:var(--acc);color:var(--accInk);font-weight:700}
.btn.ghosty{border-color:var(--line);color:var(--ink)}
.btn:disabled{opacity:.38;cursor:default}
.btn:focus-visible,.back:focus-visible,.pc:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-family:var(--disp);font-weight:400;font-size:19px}
.muted{color:var(--muted);font-size:14px}
label.f{display:block;margin:10px 0 4px;font-size:14px;color:var(--muted)}
input.in,select.in{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);padding:10px 12px;font:inherit;font-size:16px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;min-height:46px;border:0;background:transparent;cursor:pointer;font-size:15px;padding:6px 4px}
.seg button.on{background:var(--acc);color:var(--accInk);font-weight:700}
.sw{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.sw:first-of-type{border-top:0}
.sw .t{flex:1}
.sw .t small{display:block;color:var(--muted);font-size:13px}
.tg{width:52px;height:30px;border-radius:30px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.sw.on .tg{background:var(--acc)}
.sw.on .tg::after{inset-inline-start:25px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:46px;height:46px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.swatch.on{border-color:var(--ink)}
.badge{text-align:center;color:var(--muted);font-size:12px;margin:24px 0 8px}

/* ---------------- home ---------------- */
.home{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.htop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.htop .tools{display:flex;gap:8px}
.ibtn{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);font-size:20px;cursor:pointer;display:grid;place-items:center}
.hero{position:relative;margin:16px 0 18px;padding:22px 18px 18px;border-radius:22px;background:radial-gradient(ellipse at 50% 120%,var(--felt1),var(--felt2) 75%);color:var(--feltInk);overflow:hidden;border:1px solid var(--feltLine)}
.hero h1{margin:0;font-family:var(--disp);font-weight:400;font-size:36px;line-height:1.05;position:relative}
.hero p{margin:6px 0 0;opacity:.9;font-size:15px;position:relative;max-width:calc(100% - 128px)}
.hero{min-height:150px}
.hero .fan{position:absolute;inset-inline-end:6px;bottom:-26px;height:110px;width:130px;pointer-events:none;opacity:.95}
.hero .fan .pc{position:absolute;bottom:0;left:50%;transform-origin:50% 120%}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.vcard{border:1.5px solid var(--line);border-radius:16px;padding:12px;background:var(--panel);cursor:pointer;text-align:start;min-height:84px}
.vcard.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.vcard b{display:block;font-family:var(--disp);font-weight:400;font-size:19px}
.vcard span{font-size:13px;color:var(--muted)}
.modes{display:grid;gap:10px}
.mode{display:flex;align-items:center;gap:14px;min-height:68px;padding:12px 16px;border-radius:16px;border:1.5px solid var(--acc);background:transparent;cursor:pointer;text-align:start}
.mode .ic{font-size:28px;width:40px;text-align:center}
.mode b{display:block;font-size:18px}
.mode span{font-size:13px;color:var(--muted)}
.mode.main{background:var(--acc);color:var(--accInk)}
.mode.main span{color:inherit;opacity:.8}
.minor{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.minor button{min-height:64px;border-radius:14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.minor button i{font-style:normal;font-size:22px}
.lvls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

/* ---------------- game ---------------- */
#game{background:radial-gradient(ellipse at 50% 40%,var(--felt1),var(--felt2) 80%);color:var(--feltInk);min-height:100vh;min-height:100dvh}
#game.on{display:flex;flex-direction:column}
.gtop{display:flex;align-items:center;gap:8px;padding:6px 8px;background:rgba(0,0,0,.28)}
.gtop .back{height:40px;min-width:44px;border-color:var(--feltInk);color:var(--feltInk)}
.gtop .ttl{flex:1;min-width:0;font-size:14px;line-height:1.2}
.gtop .ttl b{font-family:var(--disp);font-weight:400;font-size:17px;display:block}
.gtop .ibtn{width:40px;height:40px;background:rgba(0,0,0,.25);border-color:var(--feltLine);color:var(--feltInk)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 0 4px rgba(255,235,160,.55)}}
.msg{min-height:26px;text-align:center;font-size:15px;padding:0 8px;font-weight:500}
.chip{padding:3px 10px;border-radius:20px;background:rgba(0,0,0,.3);font-size:13px}
.chip.go{background:var(--acc);color:var(--accInk);font-weight:700}
.voice{display:flex;gap:8px;padding:0 10px 8px;background:rgba(0,0,0,.28)}
.voice .btn{flex:1;min-height:46px;color:var(--feltInk);border-color:var(--feltLine);font-size:15px;padding:4px 6px}
.voice .btn.on{background:#2e8b57;border-color:#2e8b57;color:#fff}
.voice .btn.rec.on{background:#c0392b;border-color:#c0392b}
.ptt{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.net{font-size:12px;padding:2px 8px;border-radius:10px;background:rgba(0,0,0,.35)}
.net.bad{background:#a8322a;color:#fff}

/* ---------------- playing cards (CSS only) ---------------- */
.pc{--w:58px;width:var(--w);height:calc(var(--w)*1.42);border-radius:calc(var(--w)*.12);background:var(--cardFace);border:1px solid var(--cardEdge);color:var(--blk);position:relative;flex:none;box-shadow:0 2px 5px rgba(0,0,0,.3);font-family:var(--body);user-select:none;-webkit-user-select:none;overflow:hidden}
.pc.red{color:var(--red)}
.pc.s2{color:var(--s2)}.pc.s3{color:var(--s3)}
.pc .ix{position:absolute;top:calc(var(--w)*.05);left:calc(var(--w)*.07);font-weight:700;font-size:calc(var(--w)*.3);line-height:.95;text-align:center;letter-spacing:-.02em}
.pc .ix s{display:block;text-decoration:none;font-size:calc(var(--w)*.26)}
.pc .ix.b{top:auto;left:auto;bottom:calc(var(--w)*.05);right:calc(var(--w)*.07);transform:rotate(180deg)}
.pc .pip{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--w)*.62);padding-top:calc(var(--w)*.1)}
.pc .face{position:absolute;inset:calc(var(--w)*.22) calc(var(--w)*.18);border:1.5px solid currentColor;border-radius:calc(var(--w)*.08);display:grid;place-items:center;font-family:var(--disp);font-size:calc(var(--w)*.5);opacity:.95}
.pc.bk{background:repeating-linear-gradient(45deg,var(--back1) 0 5px,color-mix(in srgb,var(--back1) 70%,var(--back2)) 5px 7px);border:2px solid var(--back2)}
.pc.bk::after{content:"";position:absolute;inset:18%;border:1.5px solid var(--back2);border-radius:40%;opacity:.7}
.pc.mini{--w:30px}

/* ---------------- overlays ---------------- */
#ovs .ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#ovs .box{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:16px;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
#ovs .ov.center{align-items:center}
.ov h3{margin:0 0 6px;font-family:var(--disp);font-weight:400;font-size:24px}
.res .side{margin:10px 0;padding:10px;border-radius:14px;background:radial-gradient(ellipse at 50% 30%,var(--felt1),var(--felt2));color:var(--feltInk)}
.res .side .nm{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.res .big{font-family:var(--disp);font-size:28px;text-align:center;margin:6px 0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}
.tbl th{font-weight:500;color:var(--muted)}
.pass{position:fixed;inset:0;z-index:60;background:var(--felt2);color:var(--feltInk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.pass h2{font-family:var(--disp);font-weight:400;font-size:30px;margin:0}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--panel);color:var(--ink);border:1px solid var(--acc);padding:10px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.2s;z-index:70;max-width:90vw;text-align:center;font-size:15px}
#toast.on{opacity:1;transform:translateX(-50%)}
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:40}
.bub{position:absolute;max-width:70vw;background:#fff;color:#111;padding:8px 12px;border-radius:16px;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.35);animation:bubIn .25s ease}
.bub small{display:block;font-size:11px;color:#666}
.bub.emo{background:transparent;box-shadow:none;font-size:46px;padding:0;animation:pop 1.2s ease}
@keyframes bubIn{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3)}30%{transform:scale(1.25)}60%{transform:scale(1)}100%{transform:translateY(-14px)}}
.flyc{position:fixed;z-index:45;pointer-events:none;transition:left .32s ease,top .32s ease,transform .32s ease}
.emogrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.emogrid button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:24px;cursor:pointer}
.phr{display:grid;gap:8px;margin-top:10px}
.phr button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:15px}
.vmsg{display:flex;align-items:center;gap:8px}
.code{font-family:var(--disp);font-size:44px;letter-spacing:.12em;text-align:center;direction:ltr}
.roster{display:grid;gap:6px;margin:10px 0}
.roster div{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--panel2)}
.rules h3{font-family:var(--disp);font-weight:400;margin:18px 0 6px}
.rules p,.rules li{font-size:15px}
.tut{text-align:center}
.tut .big{font-size:60px}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--acc)}
.rp{display:flex;flex-direction:column;gap:8px}
.rp .hrow{display:flex;direction:ltr;flex-wrap:wrap;gap:2px;justify-content:center}
.rp .hrow .pc{--w:30px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* ---------------- poker table ---------------- */
:root{--rail1:#3c2616;--rail2:#24160c}
[data-board="wood"]{--rail1:#2a1a0e;--rail2:#140b05}
[data-board="blue"]{--rail1:#1d2430;--rail2:#0c1118}
[data-board="contrast"]{--rail1:#333;--rail2:#111}
[data-board="theme"]{--rail1:var(--panel);--rail2:var(--bg)}
.hide{display:none!important}
#game{background:var(--bg);color:var(--ink)}
#game.on{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.gtop{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line)}
.gtop .back{height:40px;min-width:44px}
.gtop .ttl{flex:1;min-width:0;font-size:13px;line-height:1.25;color:var(--muted)}
.gtop .ttl b{font-family:var(--disp);font-weight:400;font-size:17px;display:block;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtop .ibtn{width:40px;height:40px}
.net{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--panel2);white-space:nowrap}
.net.bad{background:#a8322a;color:#fff}
.lvlup{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--acc);color:var(--accInk);font-weight:700}
.twrap{position:relative;flex:1 1 auto;min-height:250px;max-height:min(132vw,620px);margin:auto 6px}
.oval{position:absolute;inset:34px 18px 34px;border-radius:50%/46%;background:radial-gradient(ellipse at 50% 42%,var(--felt1),var(--felt2) 78%);border:12px solid var(--rail1);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--acc) 55%,transparent),0 0 0 2px var(--rail2),0 10px 30px rgba(0,0,0,.45);color:var(--feltInk)}
.oval::after{content:"PokerNest";position:absolute;left:50%;top:70%;transform:translateX(-50%);font-family:var(--disp);font-size:clamp(16px,5vw,26px);opacity:.09;letter-spacing:.06em;pointer-events:none;white-space:nowrap}
.mid{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:76%;z-index:2;color:var(--feltInk)}
.board{display:flex;direction:ltr;gap:4px;justify-content:center;min-height:calc(var(--bw)*1.42)}
.board .pc{--w:var(--bw)}
.board .slot{width:var(--bw);height:calc(var(--bw)*1.42);border-radius:calc(var(--bw)*.12);border:1.5px dashed var(--feltLine);flex:none}
.board .pc.nw{animation:flipIn .35s ease}
@keyframes flipIn{from{transform:rotateY(90deg) scale(.9)}to{transform:none}}
.pot{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:14px}
.pot span{padding:2px 10px;border-radius:20px;background:rgba(0,0,0,.35);white-space:nowrap}
.pot span b{font-weight:700}
.tmsg{font-size:14px;text-align:center;min-height:20px;max-width:100%;font-weight:500;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.dealer-row{display:flex;flex-direction:column;align-items:center;gap:3px}
.dealer-row .dlab{font-size:13px;opacity:.9}
.dealer-row .dcards{display:flex;direction:ltr;gap:3px}
.dealer-row .pc{--w:30px}
/* seats */
.st{position:absolute;transform:translate(-50%,-50%);width:92px;z-index:3;text-align:center;font-size:12px;line-height:1.2}
.st .bx{background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:4px 5px 5px;position:relative}
.st .nm{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .sk{display:block;font-family:var(--disp);font-size:15px;color:var(--acc)}

/* my hand */
.mine{display:flex;align-items:center;gap:10px;padding:6px 12px 4px;min-height:96px}

/* action bar */
.abar{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line)}

<script>
/* ---- nestlink.js ---- */
/* =====================================================================
   NestLink 1.1 — AppNest online multiplayer module (WebRTC via PeerJS)
   One file, drop into any AppNest game. No server of our own:
   - a public PeerJS server only introduces the phones; game data, voice
     and voice messages then travel directly phone-to-phone.
   - star layout: the host is seat 0 and relays messages between guests,
     so 2–6 players work; voice is a direct mesh (good up to ~4–5).
   - every game message is sequenced and re-sent after a reconnect.
   The game owns the session object (persist it with the game state) and
   receives events through callbacks. See NESTLINK.md for the API.
   1.1: sendTo(seat, d) — a private message to one seat only (card games:
        the host deals each player only their own cards). Compatible with 1.0.
        Heartbeat: a phone that vanished (app closed, no signal) is marked offline
        within ~10 s instead of looking connected forever.
        After a reconnect, if the other side already got more messages than we
        remember sending (we restored an older saved session), numbering continues
        after theirs instead of being silently ignored.
   ===================================================================== */
const NestLink = (() => {
  const CDNS = ['https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js', 'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js'];
  const ICE = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'stun:stun.cloudflare.com:3478' }];
  const AB = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const genCode = (n = 5) => Array.from({ length: n }, () => AB[Math.floor(Math.random() * AB.length)]).join('');
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  function loadScript(u) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = u; s.onload = res; s.onerror = rej; document.head.appendChild(s); setTimeout(rej, 12000); }); }
  async function loadPeer() { if (window.Peer) return true; for (const u of CDNS) { try { await loadScript(u); if (window.Peer) return true; } catch (e) {} } return false; }
  const b64 = buf => { let s = '', a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = s => { const b = atob(s), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };

  function create(opt) {
    const L = { status: 'off', lastErr: null, peer: null, conns: {}, retry: null, chunks: {}, calls: {}, audio: {}, mic: null, talking: false, openMic: false, rec: null, seen: {}, hb: {}, hbT: null };

/* ---------- backup / restore ---------- */
function backup() {
  const data = { app: 'PokerNest', v: APP_VERSION, user: ST.name, date: new Date().toISOString(), data: {} };
  LS.keys().forEach(k => { if (k !== 'errs') data.data[k] = LS.get(k); });
  if (data.data.game && data.data.game.mode === 'online') delete data.data.game;     // a live online session can't be restored elsewhere
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'pokernest-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast(T('backupDone'));
}
function restore(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result); if (!d || d.app !== 'PokerNest' || !d.data) throw new Error('bad');
      confirmBox(T('restoreQ'), T('restore'), () => { LS.keys().forEach(k => LS.del(k)); Object.keys(d.data).forEach(k => LS.set(k, d.data[k])); location.reload(); });
    } catch (e) { toast(T('restoreBad')); }
  };
  r.readAsText(file);
}

rulesCommon:"<h3>הבסיס — לכל הגרסאות חוץ מקריבי</h3><p>משחקים עם צ'יפים וירטואליים. בכל יד הכפתור <b>D</b> (הדילר) עובר שחקן אחד הלאה. שני השחקנים משמאלו שמים <b>בליינד קטן</b> ו<b>בליינד גדול</b> לפני החלוקה. בשניים — הדילר הוא הבליינד הקטן.</p><p>בכל סבב הימורים, בתורו, כל שחקן יכול: <b>לקפל</b> (לוותר על היד), <b>צ'ק</b> (להעביר, אם אין הימור לפניו), <b>להשוות</b> להימור הגבוה, או <b>להעלות</b>. ההעלאה המינימלית היא לפחות בגודל ההעלאה הקודמת.</p><p><b>אול-אין</b>: מי שאין לו מספיק צ'יפים יכול לשים את כולם. הוא יכול לזכות רק במה ששם מכל שחקן, והשאר הולך ל<b>קופה צדדית</b> בין האחרים. אול-אין קטן מהעלאה מלאה לא פותח מחדש את ההימורים למי שכבר פעל.</p><p>אם כולם קיפלו — האחרון שנשאר לוקח את הקופה בלי להראות. אחרת, בסוף יש <b>שואודאון</b>: היד הטובה ביותר מנצחת; ביד שווה הקופה מתחלקת.</p><p><b>טורניר</b>: הבליינדים עולים כל כמה ידיים, ומי שנגמרים לו הצ'יפים יוצא — עד שנשאר אחד. <b>משחק חופשי</b>: בליינדים קבועים, אפשר לקנות מחדש, ובסוף רואים רווח והפסד.</p>",
rules_holdem:"<p>כל שחקן מקבל <b>2 קלפים</b> סגורים. על השולחן נפתחים <b>5 קלפים משותפים</b>: שלושה (פלופ), אחד (טרן) ואחד (ריבר), עם סבב הימורים לפני כל שלב — ארבעה סבבים. היד שלך היא 5 הקלפים הטובים ביותר מתוך 7. ההימור <b>בלי הגבלה</b> (<bdi>No-Limit</bdi>): אפשר להמר כל סכום, עד כל הצ'יפים.</p>",
rules_omaha:"<p>כמו הולדם, אבל כל שחקן מקבל <b>4 קלפים</b>, ו<b>חייבים להשתמש בדיוק ב-2 מהם ובדיוק ב-3 מהשולחן</b>. לכן ארבעה ♥ על השולחן הם לא צבע אם אין לך שני ♥ ביד. ברירת המחדל היא <b>הגבלת קופה</b> (<bdi>Pot-Limit</bdi>): ההעלאה הגדולה ביותר היא בגודל הקופה (אחרי ההשוואה). אפשר לבחור בלי הגבלה (<bdi>No-Limit</bdi>) בהגדרות השולחן.</p>",
rules_draw5:"<p>כל שחקן מקבל <b>5 קלפים</b> סגורים, ואין קלפים על השולחן. סבב הימורים, ואז כל שחקן בתורו <b>מחליף עד 3 קלפים</b> (או \"עומד\" בלי להחליף). כולם רואים כמה כל אחד החליף — וזה מידע! אחר כך סבב הימורים שני ושואודאון. ההימור בלי הגבלה (<bdi>No-Limit</bdi>).</p>",
rules_three:"<p>כל שחקן מקבל <b>3 קלפים</b>, יש בליינדים וסבב הימורים <b>אחד</b>, ואז שואודאון. מהיר ואגרסיבי. שימו לב לדירוג המיוחד: עם 3 קלפים קשה יותר לקבל רצף מאשר צבע, ולכן <b>רצף מנצח צבע</b>, ושלישייה מנצחת רצף. A-2-3 הוא הרצף הנמוך.</p>",
rules_carib:"<p>משחק נגד <b>הדילר</b> (הקופה), לא נגד שאר השחקנים. כל שחקן שם <b>אנטה</b> ומקבל 5 קלפים; לדילר 5 קלפים ואחד מהם פתוח. מסתכלים על היד ומחליטים: <b>לקפל</b> (מפסידים את האנטה) או <b>לשחק</b> — הימור של פי 2 מהאנטה.</p><p>הדילר צריך לפחות <b>A-K</b> כדי \"לעבור את הסף\". לא עבר — האנטה משולמת 1:1 וההימור חוזר. עבר — משווים: אם היד שלך טובה יותר, האנטה משולמת 1:1 וההימור לפי הטבלה; אם של הדילר — מפסידים את שניהם; שוויון — הכל חוזר.</p>{pay}<p>כדאי לשחק עם זוג ומעלה, ולקפל עם פחות מ-A-K. בטורניר: 30 ידיים והאנטה עולה; מי שיש לו הכי הרבה צ'יפים בסוף מנצח.</p>"

rulesCommon:"<h3>The basics — every game except Caribbean</h3><p>You play with virtual chips. Each hand the <b>D</b> button (the dealer) moves one seat on. The two players to its left post the <b>small blind</b> and <b>big blind</b> before the deal. Heads-up, the dealer is the small blind.</p><p>In each betting round, on your turn you can <b>fold</b> (give up the hand), <b>check</b> (pass, if nobody has bet), <b>call</b> the highest bet, or <b>raise</b>. A raise must be at least as big as the previous raise.</p><p><b>All-in</b>: if you don't have enough chips you can put them all in. You can only win what you put in from each player; the rest goes to a <b>side pot</b> among the others. An all-in smaller than a full raise doesn't reopen the betting for players who already acted.</p><p>If everyone folds, the last player takes the pot without showing. Otherwise there's a <b>showdown</b>: the best hand wins; equal hands split the pot.</p><p><b>Tournament</b>: blinds go up every few hands and players who run out of chips are out — until one is left. <b>Cash game</b>: fixed blinds, buy in again any time, and see the result at the end.</p>",
rules_holdem:"<p>Each player gets <b>2 cards</b> face down. <b>5 shared cards</b> are turned up on the table: three (the flop), one (the turn) and one (the river), with a betting round before each — four rounds in all. Your hand is the best 5 cards out of 7. No-Limit: bet any amount up to all your chips.</p>",
rules_omaha:"<p>Like Hold'em, but each player gets <b>4 cards</b> and must use <b>exactly 2 of them and exactly 3 from the table</b>. So four ♥ on the table aren't a flush unless you hold two ♥. The default is <b>Pot-Limit</b>: the biggest raise is the size of the pot (after calling). No-Limit can be chosen in the table settings.</p>",
rules_draw5:"<p>Each player gets <b>5 cards</b> face down and there are no shared cards. A betting round, then each player in turn <b>swaps up to 3 cards</b> (or stands pat). Everyone sees how many cards each player swapped — that's information! Then a second betting round and the showdown. No-Limit.</p>",
rules_three:"<p>Each player gets <b>3 cards</b>; there are blinds and <b>one</b> betting round, then the showdown. Quick and aggressive. Note the special ranking: with 3 cards a straight is harder to get than a flush, so <b>a straight beats a flush</b>, and three of a kind beats a straight. A-2-3 is the lowest straight.</p>",
rules_carib:"<p>You play against <b>the dealer</b> (the house), not the other players. Each player posts an <b>ante</b> and gets 5 cards; the dealer gets 5 with one face up. Look at your hand and decide: <b>fold</b> (lose the ante) or <b>play</b> — a bet of twice the ante.</p><p>The dealer needs at least <b>A-K</b> to qualify. If not, the ante pays 1:1 and the bet comes back. If the dealer qualifies, hands are compared: if yours is better, the ante pays 1:1 and the bet pays by the table; if the dealer's is better you lose both; a tie returns everything.</p>{pay}<p>Play a pair or better, fold anything below A-K. Tournament: 30 hands with a rising ante; most chips at the end wins.</p>"
};

rulesCommon:"<h3>Основы — для всех игр, кроме Карибского</h3><p>Играем виртуальными фишками. В каждой раздаче кнопка <b>D</b> (дилер) переходит на одно место. Двое слева от неё ставят <b>малый</b> и <b>большой блайнд</b>. Вдвоём дилер ставит малый блайнд.</p><p>В каждом круге торговли в свой ход можно: <b>пас</b> (сбросить руку), <b>чек</b> (если ставок не было), <b>колл</b> (уравнять) или <b>рейз</b> (повысить). Рейз — не меньше предыдущего повышения.</p><p><b>Олл-ин</b>: если фишек не хватает, можно поставить все. Игрок выигрывает только то, что сам поставил с каждого; остальное идёт в <b>побочный банк</b>. Олл-ин меньше полного рейза не открывает торговлю заново для тех, кто уже ходил.</p><p>Если все сбросили, последний забирает банк не показывая карт. Иначе — <b>вскрытие</b>: лучшая рука выигрывает, равные делят банк.</p><p><b>Турнир</b>: блайнды растут, выбывшие покидают стол — до последнего. <b>Кэш-игра</b>: блайнды постоянные, можно купить снова, в конце виден итог.</p>",

rules_omaha:"<p>Как холдем, но у каждого <b>4 карты</b>, и нужно использовать <b>ровно 2 из них и ровно 3 со стола</b>. Четыре ♥ на столе — не флеш, если у вас нет двух ♥. По умолчанию <b>пот-лимит</b>: максимальный рейз — размер банка (после колла). Безлимит можно выбрать в настройках стола.</p>",
rules_draw5:"<p>Каждый получает <b>5 карт</b>, общих карт нет. Круг торговли, затем каждый по очереди <b>меняет до 3 карт</b> (или остаётся без обмена). Все видят, сколько карт поменял каждый — это информация! Затем второй круг и вскрытие. Безлимит.</p>",
rules_three:"<p>Каждый получает <b>3 карты</b>, блайнды и <b>один</b> круг торговли, затем вскрытие. Быстро и агрессивно. Особое старшинство: с 3 картами стрит собрать труднее, чем флеш, поэтому <b>стрит старше флеша</b>, а сет старше стрита. A-2-3 — младший стрит.</p>",
rules_carib:"<p>Игра против <b>дилера</b> (заведения), а не против других игроков. Каждый ставит <b>анте</b> и получает 5 карт; у дилера 5 карт, одна открыта. Решите: <b>пас</b> (теряете анте) или <b>играть</b> — ставка в два анте.</p><p>Дилеру нужно хотя бы <b>A-K</b>. Если нет — анте платится 1:1, ставка возвращается. Если да — руки сравниваются: ваша лучше — анте 1:1, ставка по таблице; лучше у дилера — теряете обе; равенство — всё возвращается.</p>{pay}<p>Играйте с парой и выше, сбрасывайте всё ниже A-K. Турнир: 30 раздач, анте растёт; побеждает тот, у кого больше фишек.</p>"

rulesCommon:"<h3>Lo básico — todos los juegos menos Caribbean</h3><p>Se juega con fichas virtuales. En cada mano el botón <b>D</b> (repartidor) avanza un asiento. Los dos jugadores a su izquierda ponen la <b>ciega pequeña</b> y la <b>ciega grande</b>. Entre dos, el repartidor pone la ciega pequeña.</p><p>En cada ronda de apuestas, en tu turno puedes <b>retirarte</b>, <b>pasar</b> (si nadie apostó), <b>igualar</b> la apuesta más alta o <b>subir</b>. Una subida debe ser al menos como la anterior.</p><p><b>All-in</b>: si no te alcanzan las fichas puedes meterlas todas. Solo ganas lo que pusiste de cada jugador; el resto va a un <b>bote lateral</b> entre los demás. Un all-in menor que una subida completa no reabre las apuestas para quien ya actuó.</p><p>Si todos se retiran, el último se lleva el bote sin mostrar. Si no, hay <b>enfrentamiento</b>: gana la mejor mano; manos iguales reparten.</p><p><b>Torneo</b>: las ciegas suben y quien se queda sin fichas sale — hasta que queda uno. <b>Partida libre</b>: ciegas fijas, se puede recomprar y al final ves el resultado.</p>",

rules_omaha:"<p>Como Hold'em, pero cada uno recibe <b>4 cartas</b> y debe usar <b>exactamente 2 de ellas y exactamente 3 de la mesa</b>. Cuatro ♥ en la mesa no son color si no tienes dos ♥. Por defecto es <b>Pot-Limit</b>: la subida máxima es el tamaño del bote (después de igualar). Se puede elegir sin límite en los ajustes de la mesa.</p>",
rules_draw5:"<p>Cada uno recibe <b>5 cartas</b> tapadas y no hay cartas comunes. Una ronda de apuestas y luego cada jugador <b>cambia hasta 3 cartas</b> (o se planta). Todos ven cuántas cambió cada uno — ¡es información! Después, segunda ronda y enfrentamiento. Sin límite.</p>",
rules_three:"<p>Cada uno recibe <b>3 cartas</b>; hay ciegas y <b>una</b> ronda de apuestas, y luego enfrentamiento. Rápido y agresivo. Ojo con el ranking especial: con 3 cartas una escalera es más difícil que un color, así que <b>la escalera gana al color</b> y el trío gana a la escalera. A-2-3 es la escalera más baja.</p>",
rules_carib:"<p>Se juega contra <b>el crupier</b> (la casa), no contra los demás. Cada jugador pone un <b>ante</b> y recibe 5 cartas; el crupier recibe 5 con una descubierta. Decide: <b>retirarte</b> (pierdes el ante) o <b>jugar</b> — una apuesta del doble del ante.</p><p>El crupier necesita al menos <b>A-K</b> para calificar. Si no califica, el ante paga 1:1 y la apuesta vuelve. Si califica se comparan: si tu mano es mejor, el ante paga 1:1 y la apuesta según la tabla; si es mejor la del crupier pierdes ambas; empate devuelve todo.</p>{pay}<p>Juega con pareja o más y retírate con menos de A-K. Torneo: 30 manos con ante creciente; gana quien tenga más fichas.</p>"

rulesCommon:"<h3>الأساسيات — لكل الألعاب عدا الكاريبي</h3><p>تُلعب برقائق افتراضية. في كل يد ينتقل زر <b>D</b> (الموزّع) مقعدًا واحدًا. اللاعبان على يساره يضعان <b>البلايند الصغير</b> و<b>البلايند الكبير</b> قبل التوزيع. بين لاعبين، الموزّع هو البلايند الصغير.</p><p>في كل جولة رهان، في دورك يمكنك: <b>الانسحاب</b>، <b>التمرير</b> (إن لم يراهن أحد)، <b>مجاراة</b> أعلى رهان، أو <b>الرفع</b>. يجب أن يكون الرفع بحجم الرفع السابق على الأقل.</p><p><b>أول-إن</b>: إن لم تكفِ رقائقك يمكنك وضعها كلها. تربح فقط ما وضعته من كل لاعب، والباقي يذهب إلى <b>وعاء جانبي</b> بين الآخرين. الأول-إن الأصغر من رفع كامل لا يعيد فتح الرهان لمن لعب.</p><p>إن انسحب الجميع يأخذ الأخير الوعاء دون كشف. وإلا تُكشف الأوراق: أفضل يد تفوز، والأيدي المتساوية تتقاسم.</p><p><b>البطولة</b>: يرتفع البلايند ومن تنفد رقائقه يخرج — حتى يبقى واحد. <b>اللعب الحر</b>: بلايند ثابت، يمكن الشراء من جديد، وتُرى النتيجة في النهاية.</p>",
rules_holdem:"<p>يحصل كل لاعب على <b>ورقتين</b> مقلوبتين. تُكشف على الطاولة <b>5 أوراق مشتركة</b>: ثلاث (الفلوب)، واحدة (التيرن) وواحدة (الريفر)، مع جولة رهان قبل كل منها — أربع جولات. يدك هي أفضل 5 أوراق من 7. بلا حد: راهن بأي مبلغ.</p>",
rules_omaha:"<p>مثل الهولدم، لكن لكل لاعب <b>4 أوراق</b> ويجب استخدام <b>ورقتين منها بالضبط وثلاث من الطاولة بالضبط</b>. أربع ♥ على الطاولة ليست لونًا إن لم تكن في يدك ورقتا ♥. الافتراضي <b>حد الوعاء</b>: أكبر رفع بحجم الوعاء (بعد المجاراة). يمكن اختيار بلا حد من إعدادات الطاولة.</p>",
rules_draw5:"<p>يحصل كل لاعب على <b>5 أوراق</b> مقلوبة ولا توجد أوراق مشتركة. جولة رهان، ثم يبدّل كل لاعب بدوره <b>حتى 3 أوراق</b> (أو لا يبدّل). الجميع يرى كم بدّل كل لاعب — وهذه معلومة! ثم جولة ثانية وكشف. بلا حد.</p>",
rules_three:"<p>يحصل كل لاعب على <b>3 أوراق</b>، مع بلايند وجولة رهان <b>واحدة</b>، ثم الكشف. سريعة وهجومية. انتبه للترتيب الخاص: مع 3 أوراق المتتالية أصعب من اللون، لذلك <b>المتتالية تغلب اللون</b>، والثلاثية تغلب المتتالية. A-2-3 أدنى متتالية.</p>",
rules_carib:"<p>تلعب ضد <b>الموزّع</b> (الكازينو) لا ضد بقية اللاعبين. يضع كل لاعب <b>أنتي</b> ويحصل على 5 أوراق؛ وللموزّع 5 أوراق واحدة منها مكشوفة. قرّر: <b>الانسحاب</b> (تخسر الأنتي) أو <b>اللعب</b> — رهان بضعف الأنتي.</p><p>يحتاج الموزّع إلى <b>A-K</b> على الأقل ليتأهل. إن لم يتأهل يُدفع الأنتي 1:1 ويعود الرهان. إن تأهل تُقارن الأيدي: يدك أفضل — الأنتي 1:1 والرهان حسب الجدول؛ يد الموزّع أفضل — تخسر الاثنين؛ التعادل يعيد كل شيء.</p>{pay}<p>العب بزوج أو أعلى وانسحب بأقل من A-K. البطولة: 30 يدًا والأنتي يرتفع؛ يفوز صاحب أكبر عدد من الرقائق.</p>"

/* =====================================================================

   G = the game on this phone. mode: cpu | two | online

   ===================================================================== */
let G = LS.get('game', null);
const FAST = /[?&]fast=1/.test(location.search);       // tests only: no human-friendly pauses
let aiT = null, nextT = null, PASS_ON = false, RAISE = null, DSEL = [], BUSY = false, WATCH = false, LAST_BOARD = 0, EQC = null;
const saveGame = () => { if (G) LS.set('game', G); else LS.del('game'); };
const isGuest = () => !!(G && G.mode === 'online' && G.net && G.net.role === 'guest');
const isHostOnline = () => !!(G && G.mode === 'online' && !isGuest());
const H_ = () => G && G.M ? G.M.H : null;
const isBot = s => !!(G && G.bots && G.bots[s] != null);
const humanSeats = () => { const v = curView(); if (!v) return []; return Array.from({ length: v.n }, (_, i) => i).filter(s => !isBot(s)); };

function mySeat() {
  if (!G) return 0;
  if (G.mode === 'online') return isGuest() ? (G.v ? G.v.seat : -1) : 0;
  if (G.mode === 'two') { const t = PK.toAct(G.M); if (t != null && !isBot(t)) return t; return G.viewer != null ? G.viewer : 0; }
  return 0;
}
function curView() {
  if (!G) return null;
  if (isGuest()) return G.v;
  return G.M ? PK.view(G.M, mySeat()) : null;
}
function nameOf(v, s) {
  if (s == null || s < 0) return '';
  if (isBot(s)) { const k = Object.keys(G.bots).map(Number).sort((a, b) => a - b).indexOf(s) + 1; return (v && v.names[s]) || T('cpuN', k); }
  if (G && G.mode === 'cpu' && s === 0) return ST.name || T('you');
  return (v && v.names[s]) || T('player') + ' ' + (s + 1);
}
const shortLvl = s => isBot(s) && G.mode !== 'cpu' ? ' · ' + T(LVL[G.bots[s]]) : '';

function matchCfg(o) {
  const bb = o.bb || 20, v = o.var;
  return { var: v, stack: o.stack || 1000, sb: Math.max(1, Math.round(bb / 2)), bb, ante: Math.max(1, Math.round(bb / 2)) * (v === 'carib' ? 2 : 1), structure: o.structure || 'tour', every: o.every || 10,
    limit: v === 'omaha' ? (o.limit || ST.omahaLimit) : 'nl', drawMax: 3, caribHands: 30 };
}
function startCpu(o) {
  const n = 1 + o.opps, bots = {}; for (let s = 1; s < n; s++) bots[s] = o.level;
  const M = PK.newMatch(Object.assign(matchCfg(o), { names: Array(n).fill(''), dealer: Math.floor(Math.random() * n) }));
  G = { mode: 'cpu', var: o.var, level: o.level, M, bots, id: Date.now(), hints: 0, counted: {} };
  freshHand(); saveGame(); show('game'); afterChange();
}
function startTwo(o) {
  const names = o.names.concat(Array(o.cpus).fill('')), bots = {}; for (let i = o.names.length; i < names.length; i++) bots[i] = o.level;

function renderReplays() {

function replayFrames(r) {
  const n = r.start.length;
  const M = PK.newMatch({ var: r.var, names: r.names, stacks: r.start, sb: r.sb, bb: r.bb, ante: r.ante, structure: 'cash', limit: r.limit, drawMax: r.drawMax, dealer: r.dealer, noStart: true });
  M.sb = r.sb; M.bb = r.bb; M.ante = r.ante; M.start = Math.max(...r.start, 1);
  PK.startHand(M, r.seed);
  const snap = () => JSON.parse(JSON.stringify(M.H)), frames = [{ H: snap(), e: null, st: M.stacks.slice() }];
  for (const e of r.log) {
    if (e[0] < 0 || e[1] === 'sb' || e[1] === 'bb') continue;
    const a = e[1] === 'bet' || e[1] === 'raise' ? { a: 'raise', to: e[2] } : e[1] === 'draw' ? { a: 'draw', d: e[3] || [] } : { a: e[1] };
    if (!PK.apply(M, e[0], a)) break;
    frames.push({ H: snap(), e, st: M.stacks.slice() });
  }
  void n; return frames;
}
function playReplay(r) {
  let frames; try { frames = replayFrames(r); } catch (e) { toast(T('replayBad')); return; }
  let i = 0, auto = null, all = false;
  const o = overlay('<h3>' + esc(T('replay')) + ' · ' + esc(vName(r.var)) + '</h3><div class="rp" id="rpBody"></div><div class="row" dir="ltr" style="margin-top:10px"><button class="btn" data-k="0">⏮</button><button class="btn" data-k="-1">◀</button><button class="btn main" data-k="p">▶</button><button class="btn" data-k="1">▶|</button><button class="btn" data-k="9">⏭</button></div><div class="row" style="margin-top:8px">' + (r.mode === 'cpu' && r.hide.length ? '<button class="btn ghosty" data-k="all">👁 ' + esc(T('showAll')) + '</button>' : '') + '<button class="btn ghosty" data-k="x">' + esc(T('close')) + '</button></div>', 'center');
  function draw() {
    const f = frames[i], H = f.H, e = f.e, nm = s => r.names[s] || '';
    const words = { fold: T('aFold'), check: T('aCheck'), call: r.var === 'carib' ? T('aPlay') : T('aCall'), bet: T('aBet'), raise: T('aRaise') };
    let t = !e ? T('dealt') : nm(e[0]) + ': ' + (e[1] === 'draw' ? (e[2] ? T('drewN', e[2]) : T('standPat')) : words[e[1]] + (e[1] === 'bet' || e[1] === 'raise' || e[1] === 'call' ? ' ' + chips(e[1] === 'call' ? e[2] : e[2]) : ''));
    if (i === frames.length - 1 && H.res) t += '\n' + (r.sum || '');
    const pot = H.contrib.reduce((a, b) => a + b, 0);
    let h = '';
    for (const s of H.seats) {
      const hid = !all && r.hide.includes(s), cs = H.hole[s] || [];
      h += '<div><b>' + esc(nm(s)) + (s === r.seat ? ' ★' : '') + '</b> <span class="muted">' + chips(f.st[s]) + (H.st[s] === 'fold' ? ' · ' + esc(T('aFold')) : '') + '</span><div class="hrow">' + cs.map(c => cardHTML(hid ? -1 : c, '', 'style="--w:30px"')).join('') + '</div></div>';
    }
    if (H.board.length) h += '<div class="hrow" style="gap:4px">' + H.board.map(c => cardHTML(c, '', 'style="--w:36px"')).join('') + '</div>';
    if (H.dealerCards) h += '<div class="hrow"><span class="muted">' + esc(T('dealer')) + '</span>' + H.dealerCards.map((c, j) => cardHTML(H.phase === 'end' || j === 0 ? c : -1, '', 'style="--w:30px"')).join('') + '</div>';
    h += '<p style="text-align:center;min-height:44px;white-space:pre-line">' + esc(t) + (pot && r.var !== 'carib' ? '<br><span class="muted">' + esc(T('pot')) + ' ' + chips(pot) + '</span>' : '') + '</p><p class="muted" style="text-align:center">' + iso(i + ' / ' + (frames.length - 1)) + '</p>';
    $('#rpBody').innerHTML = h;
  }
  o.addEventListener('click', e => {
    const k = e.target.closest('[data-k]'); if (!k) return; const v = k.dataset.k;
    if (v === 'x') { clearInterval(auto); closeOv(o); return; }
    if (v === 'all') { all = !all; draw(); return; }
    if (v === 'p') { if (auto) { clearInterval(auto); auto = null; k.textContent = '▶'; } else { k.textContent = '⏸'; auto = setInterval(() => { if (i < frames.length - 1) { i++; draw(); } else { clearInterval(auto); auto = null; k.textContent = '▶'; } }, 1000); } return; }
    i = v === '0' ? 0 : v === '9' ? frames.length - 1 : Math.max(0, Math.min(frames.length - 1, i + +v)); draw();
  });
  draw();
}

    '<div class="row" style="margin-top:10px"><a class="btn" href="mailto:appnest55@gmail.com?subject=PokerNest%20' + APP_VERSION + '">✉️ ' + esc(T('feedback')) + '</a><button class="btn" id="aTour">🧭 ' + esc(T('tourAgain')) + '</button></div>' +
    '<div class="row" style="margin-top:10px"><a class="btn" href="privacy_policy.html" target="_blank">🔒 ' + esc(T('privacy')) + '</a><button class="btn" id="aRules">📖 ' + esc(T('rules')) + '</button></div>' +
    '<div class="card" style="margin-top:14px"><h3>' + esc(T('disclaimerT')) + '</h3><p class="muted">' + esc(T('disclaimer')) + '</p></div>' +
    '<div class="card"><h3>' + esc(T('diag')) + '</h3><p class="muted" style="direction:ltr;text-align:left;font-size:12px;word-break:break-all">' + esc('v' + APP_VERSION + ' · ' + navigator.userAgent.slice(0, 120) + ' · SW:' + ('serviceWorker' in navigator) + ' · WebRTC:' + (!!window.RTCPeerConnection) + ' · mic:' + !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) + '</p>' + (ERRS.length ? '<p class="muted" style="direction:ltr;text-align:left;font-size:12px">' + ERRS.map(e => esc(e.t.slice(5, 16) + ' ' + e.m)).join('<br>') + '</p>' : '<p class="muted">' + esc(T('noErrors')) + '</p>') + '</div>';
  $('#aShare').onclick = async () => { const d = { title: 'PokerNest', text: T('shareText') + (ST.name ? ' — ' + ST.name : ''), url: location.origin + location.pathname }; try { if (navigator.share) await navigator.share(d); else { await navigator.clipboard.writeText(d.url); toast(T('copied')); } } catch (e) {} };
  $('#aTour').onclick = () => tour(true);
  $('#aRules').onclick = () => { renderRules(); RULES_BACK = 'about'; show('rules'); };
}

/* ---------- first-run tour ---------- */
function tour(force) {
  if (!force && ST.tutDone) return;
  const steps = [['🃏', 'tour1t', 'tour1'], ['🪙', 'tour2t', 'tour2'], ['🎚️', 'tour3t', 'tour3'], ['🏆', 'tour4t', 'tour4'], ['💡', 'tour5t', 'tour5'], ['🌍', 'tour6t', 'tour6']];
  let i = 0;
  const o = overlay('<div class="tut" id="tutB"></div>', 'center'); o.dataset.lock = '1';
  function draw() {
    const [ic, t, b] = steps[i];
    $('#tutB').innerHTML = '<div class="big">' + ic + '</div><h3>' + esc(T(t)) + '</h3><p>' + esc(T(b)) + '</p><div class="dots">' + steps.map((_, j) => '<i class="' + (j === i ? 'on' : '') + '"></i>').join('') + '</div><div class="row"><button class="btn ghosty" data-k="skip">' + esc(T('skip')) + '</button><button class="btn main" data-k="next">' + esc(i === steps.length - 1 ? T('letsPlay') : T('next')) + '</button></div>';
  }
  o.addEventListener('click', e => { const k = e.target.closest('[data-k]'); if (!k) return; if (k.dataset.k === 'next' && i < steps.length - 1) { i++; draw(); return; } ST.tutDone = true; saveST(); closeOv(o); });
  draw();
}

/* ---------- init ---------- */
function init() {
  applyLook(); applyLang(); initLink(); bindGame(); bindVoice();
  $$('[data-home]').forEach(b => b.onclick = () => {
    if (b.closest('#rules') && RULES_BACK !== 'home') { const t = RULES_BACK; RULES_BACK = 'home'; show(t); return; }
    if (b.closest('#lobby') && G && G.mode === 'online' && !G.M && !G.v) { netLeave(); return; }
    show('home'); renderHome();
  });
  $('#hTheme').onclick = () => { ST.theme = THEMES[(THEMES.indexOf(ST.theme) + 1) % THEMES.length]; saveST(); applyLook(); toast('🎨 ' + T('theme')); };
  $('#hMode').onclick = () => { ST.mode = ST.mode === 'day' ? 'night' : 'day'; saveST(); applyLook(); };
  $('#hLang').onclick = () => { const ks = Object.keys(LANGS); ST.lang = ks[(ks.indexOf(ST.lang) + 1) % ks.length]; saveST(); renderHome(); toast(LANGS[ST.lang]); };
  $('#hAbout').onclick = () => { renderAbout(); show('about'); };
  $('#hRules').onclick = () => { renderRules(); RULES_BACK = 'home'; show('rules'); };
  $('#hStats').onclick = () => { renderStats(); show('stats'); };
  $('#hReplays').onclick = () => { renderReplays(); show('replays'); };
  $('#hSettings').onclick = () => { renderSettings(); show('settings'); };
  $('#vgrid').onclick = e => { const b = e.target.closest('[data-v]'); if (b) { ST.variant = b.dataset.v; saveST(); renderHome(); } };
  $('#mCpu').onclick = () => setupBox('cpu');
  $('#mTwo').onclick = () => setupBox('two');
  $('#mOnline').onclick = () => { if (G && G.mode === 'online') { show(G.M || G.v ? 'game' : 'lobby'); if (!G.M && !G.v) renderLobby(); } else openOnline(); };
  $('#mCont').onclick = () => {
    if (!G) return;
    if (G.mode === 'online') { show(G.M || G.v ? 'game' : 'lobby'); if (!G.M && !G.v) renderLobby(); return; }
    if (G.mode === 'two') { const t = PK.toAct(G.M); if (t != null && !isBot(t)) PASS_ON = true; }
    show('game'); afterChange();
  };
  // a saved game from an incompatible build is dropped gently
  if (G && G.M && G.M.v !== 1) { G = null; saveGame(); }
  if (G && G.mode === 'online' && G.net && G.net.sess) { LINK.resume(G.net.sess); if (isGuest() && G.v) setTimeout(() => LINK.isOpen() && LINK.sendTo(0, { type: 'hello' }), 1500); }
  else if (G && G.mode === 'online') { G = null; saveGame(); }
  const q = new URLSearchParams(location.search), jc = q.get('join');
  renderHome();
  if (jc) {
    const q2 = new URLSearchParams(location.search); q2.delete('join'); history.replaceState(null, '', location.pathname + (q2.toString() ? '?' + q2 : ''));
    if (G && G.mode === 'online' && LINK.session && LINK.session.code === jc.toUpperCase()) show(G.v ? 'game' : 'lobby');
    else if (G && G.mode === 'online') { toast(T('alreadyInRoom')); show('lobby'); renderLobby(); }
    else { if (!ST.name) { show('lobby'); renderLobby(); $('#lCode').value = jc.toUpperCase(); toast(T('enterNameJoin'), 4000); } else openOnline(jc); }
  } else if (G && G.mode === 'online') { show(G.M || G.v ? 'game' : 'lobby'); if (!(G.M || G.v)) renderLobby(); else afterChange(); }
  else tour(false);
  if (location.protocol === 'file:') toast(T('fileWarn'), 6000);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !q.get('nosw')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
document.addEventListener('DOMContentLoaded', init);

</script>
